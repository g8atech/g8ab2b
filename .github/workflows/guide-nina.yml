name: Guide di Nina

# Ogni ora scarica da Brain le guide firmate (Marketing → Guide) e le mette nel sito.
# Se non cambia nulla non committa: niente deploy inutili.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide-nina
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica le guide firmate
        run: node scripts/sync-guide.mjs g8a src/data/guideNina.ts
      - name: Pubblica se cambiate
        run: |
          if git diff --quiet; then echo "Nessuna guida nuova o modificata"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/guideNina.ts
          git commit -m "Guide di Nina: aggiornate le guide firmate in Brain"
          git pull --rebase
          git push
